[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studiengang-steckbriefe"
version = "14.0.0"
description = "FOM Studiengang-Steckbriefe Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0",
  "flask-cors>=5.0",
  "pyodbc>=5.0",

  "python-dotenv>=1.0",
  "pymysql>=1.1.1",
  "waitress>=3.0.1",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "msal>=1.28",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studiengang_steckbriefe = [
  "templates/**/*",
  "static/**/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=studiengang_steckbriefe --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["src/studiengang_steckbriefe"]
omit = [
    "tests/*",
    "check_*.py",
    "compare_*.py",
    "find_*.py",
    "fix_*.py",
    "_fix_*.py",
    "show_*.py",
    "wsgi.py",
    "vergleich_logik.py",
    "test_new_query.py",
    "src/studiengang_steckbriefe/services/queries.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/studiengang_steckbriefe/services/queries.py" = ["E501"]
"src/studiengang_steckbriefe/services/steckbrief.py" = ["E501"]
"check_*.py" = ["E501", "E402"]
"compare_*.py" = ["E501"]
"find_*.py" = ["E501"]
"fix_*.py" = ["E501"]
"_fix_*.py" = ["E501", "E401", "I001"]
"show_*.py" = ["E501"]
"test_new_query.py" = ["E501", "E402"]
"vergleich_logik.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = [
    "src/studiengang_steckbriefe/services/queries.py",
    "src/studiengang_steckbriefe/services/steckbrief.py",
    ".github/**",
]
