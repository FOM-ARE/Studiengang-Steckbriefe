        function renderAnrechnungen(p) {

        function getHSZFilteredStammdaten(p) {

        function renderStudienerfolg(p) {
            if (!p.studienerfolg) return `<div class="sections-grid"><div class="section" style="grid-column: 1/-1; text-align: center; padding: 48px 24px;"><div style="font-size: 48px; margin-bottom: 16px;">📊</div><h3 style="color: var(--fom-gray-600); margin-bottom: 8px;">Keine Studienabschluss-Daten vorhanden</h3><p style="color: var(--fom-gray-400); font-size: 14px;">Für diesen Studiengang liegen keine Studienabschluss-Daten vor.</p></div></div>`;
            const s = getHSZFilteredStudienerfolg(p);
            if (!s) return;

            // Vorberechnete gefilterte Daten verwenden (Abbrecher bereits in prepareComputedData entfernt)
            const { fLabels, fFom } = p._computed.studienerfolg;
            // Use HSZ-filtered fachsemester_sg
            const abbIdx = p.studienerfolg.fachsemester_labels.indexOf('Abbrecher');
            const fSg = s.fachsemester_sg.filter((_, i) => i !== abbIdx);

            // Split into Semester-Spalten vs. Verbleib-Spalten
            const semCount = fLabels.filter(l => /^\d/.test(l)).length;
            const statusCount = fLabels.length - semCount;

            // Datentabelle Abbrecherquote – Semester-Spalten
            const semTh = fLabels.slice(0, semCount).map(l => `<th style="text-align: center; background: var(--fom-gray-400); color: white; padding: 6px 4px; font-size: 10px;">${l}</th>`).join('');
            const semFom = fFom.slice(0, semCount).map(v => `<td style="text-align: center; padding: 6px 4px; font-size: 11px;">${v.toFixed(1).replace('.', ',')}%</td>`).join('');
            const semSg = fSg.slice(0, semCount).map(v => `<td style="text-align: center; padding: 6px 4px; font-size: 11px; font-weight: 600;">${v.toFixed(1).replace('.', ',')}%</td>`).join('');

            // Datentabelle Abbrecherquote – Verbleib-Spalten
            const stTh = fLabels.slice(semCount).map(l => `<th style="text-align: center; background: var(--fom-primary); color: white; padding: 6px 4px; font-size: 10px; white-space: pre-line;">${l}</th>`).join('');
            const stFom = fFom.slice(semCount).map((v, i) => `<td style="text-align: center; padding: 6px 4px; font-size: 11px;${i === 0 ? ' border-left: 2px solid var(--fom-gray-300);' : ''}">${v.toFixed(1).replace('.', ',')}%</td>`).join('');
            const stSg = fSg.slice(semCount).map((v, i) => `<td style="text-align: center; padding: 6px 4px; font-size: 11px; font-weight: 600;${i === 0 ? ' border-left: 2px solid var(--fom-gray-300);' : ''}">${v.toFixed(1).replace('.', ',')}%</td>`).join('');

            // Datentabelle Verlängerungssemester
            const verlTh = s.verlaengerung_labels.map(l => `<th style="text-align: center; background: linear-gradient(135deg, var(--fom-primary) 0%, var(--fom-primary-dark) 100%); color: white; padding: 6px 8px; font-size: 11px;">${l}</th>`).join('');
            const verlFom = s.verlaengerung_fom.map(v => `<td style="text-align: center; padding: 6px 4px; font-size: 11px;">${v.toLocaleString('de-DE')}</td>`).join('');
            const verlSg = s.verlaengerung_sg.map(v => `<td style="text-align: center; padding: 6px 4px; font-size: 11px; font-weight: 600;">${v.toLocaleString('de-DE')}</td>`).join('');
            const verlPct = s.verlaengerung_pct.map(v => `<td style="text-align: center; padding: 6px 4px; font-size: 11px; color: var(--fom-gray-600);">${v.toFixed(1).replace('.', ',')}%</td>`).join('');

            return `<div class="sections-grid">
                <div class="section" style="grid-column: 1/-1;">
                    <h3>📊 Abbrecherquote pro Fachsemester* <span style="font-weight: 400; font-size: 13px; color: var(--fom-gray-600);">(letzte 5 Kohortenjahre)</span></h3>
                    <div class="chart-container tall"><canvas id="chartAbbrecherquote"></canvas></div>
                    <table class="trends-table" style="width: 100%; table-layout: fixed; margin-top: 16px;">
                        <thead>
                            <tr>
                                <th style="background: var(--fom-gray-50); border-bottom: none;" rowspan="1"></th>
                                <th colspan="${semCount}" style="text-align: center; background: var(--fom-gray-400); color: white; padding: 6px 4px; font-size: 11px; font-weight: 700; border-right: 2px solid var(--fom-gray-300);">Abbrecherquote pro Fachsemester</th>
                                <th colspan="${statusCount}" style="text-align: center; background: var(--fom-primary); color: white; padding: 6px 4px; font-size: 11px; font-weight: 700;">Verbleib</th>
                            </tr>
                            <tr><th style="text-align: left; background: var(--fom-gray-400); color: white; padding: 6px 8px; font-size: 11px; width: 140px;"></th>${semTh}${stTh}</tr>
                        </thead>
                        <tbody>
                            <tr><td style="padding: 6px 8px; font-size: 11px; font-weight: 600; background: var(--fom-gray-50);">🟠 alle FOM Studiengänge</td>${semFom}${stFom}</tr>
                            <tr><td style="padding: 6px 8px; font-size: 11px; font-weight: 600; background: var(--fom-gray-50);">🟢 ${p.kurzname}</td>${semSg}${stSg}</tr>
                        </tbody>
                    </table>
                </div>
                <div class="section" style="grid-column: 1/-1;">
                    <h3>📊 Verlängerungssemester</h3>
                    <div class="chart-container tall"><canvas id="chartVerlaengerung"></canvas></div>
                    <table class="trends-table" style="width: 100%; table-layout: fixed; margin-top: 16px;">
                        <thead>
                            <tr>
                                <th style="background: var(--fom-gray-50); border-bottom: none;"></th>
                                <th colspan="${s.verlaengerung_labels.length}" style="text-align: center; background: var(--fom-primary); color: white; padding: 6px 4px; font-size: 11px; font-weight: 700;">Verlängerungssemester</th>
                            </tr>
                            <tr><th style="text-align: left; background: var(--fom-primary); color: white; padding: 6px 8px; font-size: 11px; width: 160px;"></th>${verlTh}</tr>
                        </thead>
                        <tbody>
                            <tr><td style="padding: 6px 8px; font-size: 11px; font-weight: 600; background: var(--fom-gray-50);">🟠 restliche FOM Studiengänge</td>${verlFom}</tr>
                            <tr><td style="padding: 6px 8px; font-size: 11px; font-weight: 600; background: var(--fom-gray-50);">🟢 ${p.kurzname}</td>${verlSg}</tr>
                            <tr><td style="padding: 6px 8px; font-size: 11px; color: var(--fom-gray-600); background: var(--fom-gray-50);">% zu allen FOM Studiengängen</td>${verlPct}</tr>
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        function getHSZFilteredBeginner(p) {
            const t = p.entwicklungstrends;
            const semesters = t.studienbeginner_zeitreihe_semester;
            const hszDetail = t.hsz_detail || {};
            if (currentHSZ === 'Alle' || !hszDetail[currentHSZ]) {
                return { gesamt: t.studienbeginner, delta: t.studienbeginner_delta, ss: t.studienbeginner_zeitreihe_ss, ws: t.studienbeginner_zeitreihe_ws, avgSs: t.studienbeginner_zeitreihe_fom_avg_ss, avgWs: t.studienbeginner_zeitreihe_fom_avg_ws };
            }
            const h = hszDetail[currentHSZ];
            const ss = semesters.map(y => (h[y] && h[y].beginner_ss) || 0);
            const ws = semesters.map(y => (h[y] && h[y].beginner_ws) || 0);
            const avgSs = semesters.map(y => (h[y] && h[y].avg_beginner_ss) || 0);
            const avgWs = semesters.map(y => (h[y] && h[y].avg_beginner_ws) || 0);
            const cur = p._computed.semester;
            let aktuell, vorher;
            if (cur.type === 'WS') { aktuell = (ws[0] || 0) + (ss[0] || 0); vorher = (ws[1] || 0) + (ss[1] || 0); }
            else { aktuell = ss[0] || 0; vorher = ss[1] || 0; }
            const diff = aktuell - vorher;
            const pct = vorher ? (diff / vorher * 100).toFixed(1).replace('.', ',') : '0,0';
            const delta = `${diff >= 0 ? '+' : ''}${diff} (${diff >= 0 ? '+' : ''}${pct}%)`;
            return { gesamt: aktuell, delta, ss, ws, avgSs, avgWs };
        }

        function renderStudienbeginner(p) {
            const fb = getHSZFilteredBeginner(p);
            let tableHtml = buildStudienanfaengerTable(p, fb);
            const hszLabel = currentHSZ !== 'Alle' ? ` <span style="font-size: 13px; font-weight: 400; opacity: 0.85;">(${currentHSZ})</span>` : '';
            return `<div class="sections-grid"><div class="comparison-section" style="grid-column: 1/-1;"><h3>Kennzahlen aktuell${hszLabel}</h3><div class="comparison-grid"><div class="comparison-item"><div class="label">Studienbeginner</div><div class="value">${fmtInt(fb.gesamt)}</div></div><div class="comparison-item"><div class="label">Entwicklung im Vergleich zum Vorjahr</div><div class="value">${fb.delta}</div></div></div></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; grid-column: 1/-1;"><div class="section"><h3>📊 Sommersemester (SS)</h3><p style="font-size: 12px; color: var(--fom-gray-600); margin-bottom: 12px;">Studienbeginnerentwicklung im Vergleich zu allen FOM-Studiengängen</p><div class="chart-container"><canvas id="chartStudienanfaengerSS"></canvas></div></div><div class="section"><h3>📊 Wintersemester (WS)</h3><p style="font-size: 12px; color: var(--fom-gray-600); margin-bottom: 12px;">Studienbeginnerentwicklung im Vergleich zu allen FOM-Studiengängen</p><div class="chart-container"><canvas id="chartStudienanfaengerWS"></canvas></div></div></div><div style="grid-column: 1/-1; padding: 8px 12px; background: var(--fom-gray-50); border-radius: 6px; font-size: 11px; color: var(--fom-gray-600); line-height: 1.6;"><strong>Hinweise:</strong> Berücksichtigt werden Studienbeginner mit UV in Studiengänge mit der Ausrichtung national.</div><div class="section" style="grid-column: 1/-1;"><h3>📊 Zeitreihe nach Semester</h3>${tableHtml}</div></div>`;
        }

        function buildStudienanfaengerTable(p, fb) {
            const semesters = p.entwicklungstrends.studienbeginner_zeitreihe_semester;
            const sg_ss = fb.ss;
            const sg_ws = fb.ws;
            const fom_ss = fb.avgSs;
            const fom_ws = fb.avgWs;
            const hszDetail = p.entwicklungstrends.hsz_detail || {};
            const current = p._computed.semester;

            function buildHalf(type, values, avgValues, hszKey, tableId) {
                let rows = '';
                const skip = (type === 'WS' && current.type === 'SS');
                // Filter HSZ: nur Standorte mit mindestens einem Wert > 0 in einem der Semester
                const relevantHsz = (p.hszensActive || []).filter(hsz => {
                    return semesters.some(sem => {
                        const j = hszDetail[hsz] && hszDetail[hsz][sem];
                        return j && (j[hszKey] || 0) > 0;
                    });
                });
                for (let i = 0; i < semesters.length; i++) {
                    if (skip && i === 0) continue;
                    const semesterId = `${semesters[i]}-anf-${type.toLowerCase()}`;
                    const nextIdx = i + 1;
                    let pct = nextIdx >= semesters.length ? '-' : ((values[i] - values[nextIdx]) / values[nextIdx] * 100).toFixed(1);
                    if (pct !== '-' && (!isFinite(pct) || isNaN(pct))) pct = '-';
                    const isCurrent = semesters[i] == current.year && current.type === type;
                    const bg = isCurrent ? 'background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);' : 'background: var(--fom-gray-50);';
                    const border = isCurrent ? 'border-left: 3px solid #2e7d32;' : '';
                    rows += `<tr style="cursor: pointer; user-select: none;">
                        <td style="width: 4%; text-align: center;"><button id="expand-btn-${semesterId}" class="expand-btn" onclick="toggleHSZRows('${semesterId}'); event.stopPropagation();"></button></td>
                        <td style="font-weight: 600; ${bg} ${border} width: 18%;">${type}-${semesters[i]} ${isCurrent ? '★' : ''}</td>
                        <td style="width: 20%; text-align: center;">${fmtInt(values[i])}</td>
                        <td style="width: 22%; text-align: center;">${fmtInt(avgValues[i])}</td>
                        <td style="width: 20%; text-align: center;"><span style="padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; ${pct === '-' ? 'color: var(--fom-gray-600);' : (pct >= 0 ? 'background: #c8e6c9; color: #1b5e20;' : 'background: #ffcdd2; color: #b71c1c;')}">${pct === '-' ? '-' : fmtPct(pct)}</span></td>
                    </tr>`;
                    if (relevantHsz.length > 0) {
                        relevantHsz.forEach((hsz) => {
                            const hszJahr = hszDetail[hsz] && hszDetail[hsz][semesters[i]];
                            const hszValue = hszJahr ? hszJahr[hszKey] : 0;
                            const hszAvgValue = hszJahr ? (hszJahr['avg_' + hszKey] || 0) : 0;
                            const hszJahrPrev = (i + 1 < semesters.length) && hszDetail[hsz] && hszDetail[hsz][semesters[i + 1]];
                            const hszValuePrev = hszJahrPrev ? hszJahrPrev[hszKey] : 0;
                            let hszPct = (hszValuePrev > 0) ? ((hszValue - hszValuePrev) / hszValuePrev * 100).toFixed(1) : '-';
                            if (hszPct !== '-' && (!isFinite(hszPct) || isNaN(hszPct))) hszPct = '-';
                            rows += `<tr class="hsz-detail-row" data-parent-semester="${semesterId}">
                                <td style="width: 4%;"></td>
                                <td class="hsz-cell" style="width: 18%; font-size: 12px;">📍 ${hsz}</td>
                                <td style="width: 20%; text-align: center; background-color: #f9f9f9; font-size: 12px;">${fmtInt(hszValue)}</td>
                                <td style="width: 22%; text-align: center; background-color: #f9f9f9; font-size: 12px;">${hszAvgValue ? fmtInt(hszAvgValue) : '—'}</td>
                                <td style="width: 20%; text-align: center; background-color: #f9f9f9;"><span style="padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; ${hszPct === '-' ? 'color: var(--fom-gray-600);' : (hszPct >= 0 ? 'background: #c8e6c9; color: #1b5e20;' : 'background: #ffcdd2; color: #b71c1c;')}">${hszPct === '-' ? '-' : fmtPct(hszPct)}</span></td>
                            </tr>`;
                        });
                    }
                }
                return `<div><div style="margin-bottom: 8px;"><button style="background: var(--fom-primary); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px;" onclick="toggleAllHSZRows('${tableId}')">+ HSZ aufklappen</button></div><table id="${tableId}" class="trends-table" style="width: 100%; table-layout: fixed;">

                        <tr><th style="width: 4%;"></th><th colspan="4" style="text-align: center; background: linear-gradient(135deg, var(--fom-primary) 0%, var(--fom-primary-dark) 100%); color: white; padding: 8px;">${type === 'SS' ? 'Sommersemester' : 'Wintersemester'}</th></tr>

        function cloneTabContent(tabEl, originalTabEl) {
            const clone = tabEl.cloneNode(true);
            clone.style.display = 'block';
            clone.classList.add('active');
            clone.querySelectorAll('.btn-tab-refresh, .tab-header-row').forEach(el => el.remove());

            // ── Canvas → PNG Image (Seitenverhältnis exakt beibehalten) ──
            const originalCanvases = originalTabEl.querySelectorAll('canvas');
            const clonedCanvases = clone.querySelectorAll('canvas');
            originalCanvases.forEach((origCanvas, i) => {
                if (clonedCanvases[i]) {
                    try {
                        if (origCanvas.width > 0 && origCanvas.height > 0) {
                            const img = document.createElement('img');
                            img.src = origCanvas.toDataURL('image/png', 1.0);
                            // width:100% + height:auto = exakt proportionale Skalierung
                            // Das Bild füllt die Container-Breite und berechnet die
                            // Höhe automatisch aus dem Original-Seitenverhältnis → keine Verzerrung
                            img.style.cssText = 'width: 100%; height: auto; display: block;';
                            clonedCanvases[i].parentNode.replaceChild(img, clonedCanvases[i]);
                        }
                    } catch(e) { console.warn('[PDF] Canvas export failed:', e.message); }
                }
            });

            const tabId = clone.id ? clone.id.replace('tab-', '') : '';

            // ── Kompakte PDF-Styles (gut lesbar, nicht zu eng) ──
            clone.querySelectorAll('.section').forEach(el => {
                el.style.padding = '6px 10px';
                el.style.marginBottom = '6px';
                el.style.boxShadow = 'none';
                el.style.border = '1px solid #e0e0e0';
                el.style.overflow = 'visible';
            });
            clone.querySelectorAll('.sections-grid').forEach(el => {
                el.style.gap = '6px';
            });
            clone.querySelectorAll('.comparison-section').forEach(el => {
                el.style.padding = '6px 12px';
                el.style.marginBottom = '6px';
                el.style.pageBreakInside = 'avoid';
                el.style.breakInside = 'avoid';
            });
            clone.querySelectorAll('.comparison-grid').forEach(el => {
                el.style.gap = '6px';
            });
            clone.querySelectorAll('.comparison-item').forEach(el => {
                el.style.padding = '4px 8px';
            });
            clone.querySelectorAll('.comparison-item .value').forEach(el => {
                el.style.fontSize = '18px';
            });
            clone.querySelectorAll('.comparison-item .label').forEach(el => {
                el.style.fontSize = '10px';
            });
            clone.querySelectorAll('h3').forEach(el => {
                el.style.fontSize = '12px';
                el.style.marginBottom = '4px';
            });
            clone.querySelectorAll('p').forEach(el => {
                el.style.fontSize = '10px';
                el.style.marginBottom = '3px';
            });
            clone.querySelectorAll('.section-row').forEach(el => {
                el.style.padding = '2px 0';
                el.style.fontSize = '10px';
            });
            clone.querySelectorAll('table').forEach(el => {
                el.style.fontSize = '9px';
                el.style.pageBreakInside = 'avoid';
                el.style.breakInside = 'avoid';
            });
            clone.querySelectorAll('th, td').forEach(el => {
                el.style.padding = '3px 4px';
                el.style.fontSize = '9px';
            });
            clone.querySelectorAll('[style*="grid-template-columns"]').forEach(el => {
                el.style.gap = '8px';
            });
            clone.querySelectorAll('[style*="background: var(--fom-gray-50)"]').forEach(el => {
                el.style.padding = '4px 8px';
                el.style.fontSize = '9px';
                el.style.marginBottom = '4px';
            });

            // ── Chart-Container: Höhe auto, KEIN Seitenumbruch innerhalb ──
            clone.querySelectorAll('.chart-container').forEach(el => {
                el.style.height = 'auto';
                el.style.minHeight = '0';
                el.style.maxHeight = 'none';
                el.style.overflow = 'visible';
                el.style.position = 'relative';
                el.style.padding = '8px';
                el.style.marginTop = '8px';
                el.style.pageBreakInside = 'avoid';
                el.style.breakInside = 'avoid';
            });

            // ── Stammdaten: Inline height:180px auf Verteilungs-Containern entfernen ──
            if (tabId === 'stammdaten') {
                clone.querySelectorAll('.chart-container[style*="height: 180px"]').forEach(el => {
                    el.style.height = 'auto';
                });
            }

            // ── SEITENUMBRÜCHE (gezielt, damit Graphen nicht gesplittet werden) ──
            const grid = clone.querySelector('.sections-grid');
            if (grid) {
                const children = Array.from(grid.children);
                let breakBeforeIndices = [];

                // Anrechnungen: Seite 1 = Kennzahlen + Anteil-Chart
                //               Seite 2 = TOP 10 Module + TOP 10 Berufsbildung
                if (tabId === 'anrechnungen') {
                    breakBeforeIndices = [2];
                }
                // Stammdaten: Seite 1 = Durchschnittsalter + Top 5 Berufsausbildungen
                //             Seite 2 = Verteilungen (4 Charts)
                else if (tabId === 'stammdaten') {
                    breakBeforeIndices = [2];
                }
                // Studienerfolg: Seite 1 = Abbrecherquote + Tabelle
                //                Seite 2 = Verlängerungssemester + Tabelle
                else if (tabId === 'studienerfolg') {
                    breakBeforeIndices = [1];
                }

                breakBeforeIndices.forEach(idx => {
                    if (children[idx]) {
                        const pageBreak = document.createElement('div');
                        pageBreak.className = 'html2pdf__page-break';
                        pageBreak.style.cssText = 'height: 0; page-break-before: always; break-before: page;';
                        grid.insertBefore(pageBreak, children[idx]);
                    }
                });
            }

            return clone;
        }

        async function exportPDF(mode) {
            if (!currentProgramme || !currentHSB) return;
            const dropdown = document.getElementById('exportDropdown');
            dropdown.classList.remove('open');
            const btn = document.getElementById('btnExportPDF');
            btn.classList.add('loading');
            btn.textContent = '⏳ PDF wird erstellt...';

            try {
                const allTabs = document.querySelectorAll('#tabsContent > .section-content');
                const activeTab = document.querySelector('#tabsContent > .section-content.active');
                const tabButtons = document.querySelectorAll('.tab-button');

                // Alle Tabs kurz sichtbar machen, damit Charts gerendert werden
                allTabs.forEach(tab => {
                    tab.style.setProperty('display', 'block', 'important');
                });
                // Chart.js Resize triggern für alle Charts
                Object.values(charts).forEach(chart => {
                    if (chart && chart.resize) {
                        try { chart.resize(); } catch(e) {}
                    }
                });
                // Warten bis Charts gerendert sind
                await new Promise(resolve => setTimeout(resolve, 500));

                // Container wird als normales sichtbares Element im Dokumentenfluss eingefügt
                const pdfContainer = document.createElement('div');
                pdfContainer.id = 'pdf-export-container';
                pdfContainer.style.cssText = 'width: 1040px; background: white; padding: 4px 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; overflow: hidden;';

                const header = document.createElement('div');
                header.style.cssText = 'margin-bottom: 6px; padding-bottom: 4px; border-bottom: 2px solid #00998a;';
                header.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h1 style="font-size: 14px; color: #00998a; margin: 0 0 1px 0;">${currentHSB.icon} ${currentProgramme.name}</h1>
                            <p style="font-size: 10px; color: #666; margin: 0;">Hochschulbereich: ${currentHSB.name} | Abschluss: ${currentProgramme.abschluss}</p>
                        </div>
                        <div style="text-align: right; font-size: 10px; color: #999;">
                            <div>FOM Hochschule – Studiengang-Steckbrief</div>
                            <div>${new Date().toLocaleDateString('de-DE')}</div>
                        </div>
                    </div>
                `;
                pdfContainer.appendChild(header);

                let filenameLabel = '';

                if (mode === 'all') {
                    const tabBtnArr = Array.from(tabButtons);
                    allTabs.forEach((tab, idx) => {
                        const tabLabel = tabBtnArr[idx] ? tabBtnArr[idx].textContent : '';
                        const tabHeader = document.createElement('h2');
                        tabHeader.style.cssText = 'font-size: 12px; color: #333; margin-bottom: 4px; padding: 3px 8px; background: #f4f6f8; border-radius: 4px; border-left: 3px solid #00998a;' + (idx > 0 ? ' page-break-before: always; margin-top: 4px;' : '');
                        tabHeader.textContent = tabLabel;
                        pdfContainer.appendChild(tabHeader);
                        pdfContainer.appendChild(cloneTabContent(tab, tab));
                    });
                    filenameLabel = 'Alle_Tabs';
                } else {
                    const activeTabLabel = Array.from(tabButtons).find(b => b.classList.contains('active'));
                    const tabTitle = activeTabLabel ? activeTabLabel.textContent : '';
                    if (activeTab) {
                        const tabHeader = document.createElement('h2');
                        tabHeader.style.cssText = 'font-size: 12px; color: #333; margin-bottom: 4px; padding: 3px 8px; background: #f4f6f8; border-radius: 4px; border-left: 3px solid #00998a;';
                        tabHeader.textContent = tabTitle;
                        pdfContainer.appendChild(tabHeader);
                        pdfContainer.appendChild(cloneTabContent(activeTab, activeTab));
                    }
                    filenameLabel = tabTitle.replace(/[^a-zA-Z0-9äöüÄÖÜß]/g, '_').replace(/_+/g, '_');
                }

                // Tabs wieder auf Original-Zustand zurücksetzen
                allTabs.forEach(tab => {
                    tab.style.removeProperty('display');
                });

                // Bestehende Seite ausblenden, PDF-Container sichtbar einfügen
                const mainContent = document.querySelector('.container') || document.body.firstElementChild;
                const savedScrollY = window.scrollY;
                if (mainContent) mainContent.style.display = 'none';
                document.body.appendChild(pdfContainer);
                window.scrollTo(0, 0);

                // Browser Layout berechnen lassen
                await new Promise(resolve => setTimeout(resolve, 300));

                const filename = `Steckbrief_${currentProgramme.kurzname}_${filenameLabel}_${new Date().toISOString().slice(0, 10)}.pdf`;

                const opt = {
                    margin: [3, 3, 3, 3],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        logging: false,
                        width: 1040,
                        windowWidth: 1040,
                        scrollY: 0,
                        scrollX: 0,
                        x: 0,
                        y: 0,
                        onclone: function(clonedDoc) {
                            clonedDoc.querySelectorAll('.section-content').forEach(function(el) {
                                el.style.setProperty('display', 'block', 'important');
                            });
                            var c = clonedDoc.getElementById('pdf-export-container');
                            if (c) {
                                c.style.setProperty('display', 'block', 'important');
                                c.style.setProperty('visibility', 'visible', 'important');
                                c.style.setProperty('opacity', '1', 'important');
                                c.style.setProperty('width', '1040px', 'important');
                                c.style.setProperty('max-width', '1040px', 'important');
                            }
                        }
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                    pagebreak: { 
                        mode: ['css', 'legacy'],
                        before: '.html2pdf__page-break',
                        avoid: '.chart-container, .comparison-section, table'
                    }
                };

                await html2pdf().set(opt).from(pdfContainer).save();

                // Aufräumen: Container entfernen, Seite wiederherstellen
                document.body.removeChild(pdfContainer);
                if (mainContent) mainContent.style.display = '';
                window.scrollTo(0, savedScrollY);
            } catch (e) {
                console.error('[PDF Export] Fehler:', e);
                // Seite wiederherstellen falls Fehler
                const mainContent = document.querySelector('.container') || document.body.firstElementChild;
                if (mainContent) mainContent.style.display = '';
                alert('PDF-Export fehlgeschlagen: ' + e.message);
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '📄 Als PDF exportieren ▾';
            }
        }

        // ═══════════════ ADMIN PANEL ═══════════════
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                loadUsers();
            } else {
                panel.style.display = 'none';
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(API_BASE + '/users');
                const data = await res.json();
                if (!data.ok) return;
                const tbody = document.getElementById('userTableBody');
                const me = currentUser ? currentUser.username.toLowerCase() : '';
                tbody.innerHTML = data.users.map(u => `
                    <tr style="border-bottom:1px solid #f0f0f0;">
                        <td style="padding:8px 4px;">
                            <div style="font-weight:500;">${u.display_name}</div>
                            <div style="font-size:11px; color:#888;">${u.berechtigt}</div>
                            <div style="font-size:10px; color:#aaa;">${u.typ === 'gruppe' ? '👥 Gruppe' : '👤 User'}</div>
                        </td>
                        <td style="padding:8px 4px;">
                            <select onchange="changeRole(${u.id}, this.value)" style="padding:4px 8px; border:1px solid #ddd; border-radius:4px; font-size:12px;">
                                <option value="admin" ${u.recht==='admin'?'selected':''}>Admin</option>
                                <option value="write" ${u.recht==='write'?'selected':''}>Schreibzugriff</option>
                                <option value="read" ${u.recht==='read'?'selected':''}>Lesezugriff</option>
                            </select>
                        </td>
                        <td style="padding:8px 4px; text-align:right;">
                            ${(u.typ === 'user' && u.berechtigt.toLowerCase() === me) ? '' : `<button onclick="removeUser(${u.id}, '${u.berechtigt}')" style="background:none; border:none; color:#c0392b; cursor:pointer; font-size:16px;" title="Entfernen">✕</button>`}
                        </td>
                    </tr>
                `).join('');
            } catch(e) {
                document.getElementById('adminError').textContent = 'Fehler beim Laden der Benutzer.';
            }
        }

        async function addUser() {
            const input = document.getElementById('newUserInput');
            const typSelect = document.getElementById('newUserTyp');
            const errEl = document.getElementById('adminError');
            errEl.textContent = '';
            const username = input.value.trim();
            const typ = typSelect ? typSelect.value : 'user';
            if (!username) { errEl.textContent = 'Name eingeben.'; return; }
            try {
                const res = await fetch(API_BASE + '/users', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, typ })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    input.value = '';
                    loadUsers();
                } else {
                    errEl.textContent = data.error || 'Fehler beim Hinzufügen.';
                }
            } catch(e) { errEl.textContent = 'Verbindungsfehler.'; }
        }

        async function changeRole(id, recht) {
            const errEl = document.getElementById('adminError');
            errEl.textContent = '';
            try {
                const res = await fetch(API_BASE + '/users/' + id, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ recht })
                });
                const data = await res.json();
                if (!res.ok) errEl.textContent = data.error || 'Fehler.';
            } catch(e) { errEl.textContent = 'Verbindungsfehler.'; }
        }

        async function removeUser(id, name) {
            if (!confirm(`Eintrag "${name}" wirklich entfernen?`)) return;
            const errEl = document.getElementById('adminError');
            errEl.textContent = '';
            try {
                const res = await fetch(API_BASE + '/users/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok && data.ok) {
                    loadUsers();
                } else {
                    errEl.textContent = data.error || 'Fehler beim Entfernen.';
                }
            } catch(e) { errEl.textContent = 'Verbindungsfehler.'; }
        }

        // ═══════════════ AUTHENTICATION ═══════════════
        const ROLE_LABELS = { admin: 'Admin', write: 'Schreibzugriff', read: 'Lesezugriff' };

        async function checkAuth() {
            try {
                const res = await fetch(API_BASE + '/auth/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated) {
                        currentUser = data.user;
                        document.getElementById('userInfo').style.display = 'flex';
                        document.getElementById('userDisplayName').textContent = data.user.displayName || data.user.username;
                        document.getElementById('userRole').textContent = ROLE_LABELS[data.user.role] || data.user.role;
                        if (data.user.role === 'admin') {
                            document.getElementById('btnAdminPanel').style.display = 'inline-block';
                        }
                        showHome();
                        return;
                    }
                }
            } catch(e) {}
            // Nicht eingeloggt → Redirect zur Login-Seite
            window.location.href = '/login';
        }

        async function doLogout() {
            try {
                await fetch(API_BASE + '/auth/logout', { method: 'POST', credentials: 'include' });
            } catch(e) {}
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', () => checkAuth());
    </script>
</body>
</html>
